# 天罡 WAF - Nginx 配置示例（前置 Nginx 模式）
# 
# 架构说明：
# 1. Nginx 作为前置代理，接收所有外部请求
# 2. 使用 Lua 脚本动态读取 WAF 配置，决定转发目标
# 3. 请求转发到天罡 WAF (8787) 进行安全检测
# 4. WAF 检测通过后，直接转发到真实后端应用
#
# 依赖：
# - OpenResty 或 Nginx + lua-nginx-module
# - lua-resty-http 模块

# ============================================
# 1. 共享内存配置（用于 Lua 配置缓存）
# ============================================
lua_shared_dict waf_config 10m;  # 配置缓存字典，10MB

# ============================================
# 2. Lua 脚本路径配置
# ============================================
lua_package_path "/path/to/tiangang/nginx/lua/?.lua;;";

# ============================================
# 3. HTTP 块配置
# ============================================
# 初始化 Lua 模块
init_by_lua_block {
    -- 加载 WAF 配置模块
    waf_config = require "waf_config"
    
    -- 预热配置缓存
    ngx.log(ngx.INFO, "[WAF] Initializing configuration cache...")
    local ok, err = pcall(function()
        waf_config.get_config()
    end)
    
    if not ok then
        ngx.log(ngx.ERR, "[WAF] Failed to preload config: ", err)
    else
        ngx.log(ngx.INFO, "[WAF] Configuration cache initialized")
    end
}

# ============================================
# 4. 上游服务器定义
# ============================================

# 天罡 WAF 上游
upstream tiangang_waf {
    server 127.0.0.1:8787 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 默认后端（可选，用于 Lua 脚本无法获取配置时）
upstream default_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================
# 5. 内部管理接口（用于配置刷新）
# ============================================
server {
    listen 127.0.0.1:8788;  # 仅监听本地回环地址
    server_name _;
    
    # 刷新配置缓存
    location /_internal/refresh-config {
        access_log off;
        
        content_by_lua_block {
            local waf_config = require "waf_config"
            local ok, msg = waf_config.refresh_cache()
            
            if ok then
                ngx.status = 200
                ngx.say('{"code":0,"message":"Config cache refreshed"}')
            else
                ngx.status = 500
                ngx.say('{"code":1,"message":"' .. (msg or "Unknown error") .. '"}')
            end
        }
    }
    
    # 查看缓存状态
    location /_internal/cache-stats {
        access_log off;
        
        content_by_lua_block {
            local waf_config = require "waf_config"
            local cjson = require "cjson"
            local stats = waf_config.get_cache_stats()
            
            ngx.header.content_type = "application/json"
            ngx.say(cjson.encode({code = 0, data = stats}))
        }
    }
}

# ============================================
# 6. 主要 WAF 代理服务器
# ============================================
server {
    listen 80;
    listen 443 ssl http2;
    
    # 支持多域名（泛解析）
    server_name _;
    
    # SSL 配置（如果启用 HTTPS）
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    
    # 日志配置
    access_log /var/log/nginx/waf_access.log combined;
    error_log /var/log/nginx/waf_error.log warn;
    
    # 客户端配置
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    
    # 主要代理逻辑
    location / {
        # ========================================
        # A. 使用 Lua 动态获取后端地址（可选）
        # ========================================
        # 如果需要让 Nginx 直接转发到最终后端（跳过 WAF），取消注释以下代码
        # set $backend '';
        # rewrite_by_lua_block {
        #     local waf_config = require "waf_config"
        #     local host = ngx.var.http_host or ngx.var.host
        #     
        #     local backend, err = waf_config.get_backend(host)
        #     if backend then
        #         ngx.var.backend = backend
        #     else
        #         -- 使用默认后端
        #         ngx.var.backend = "http://127.0.0.1:8080"
        #         ngx.log(ngx.WARN, "[WAF] Failed to get backend for ", host, ": ", err)
        #     end
        # }
        # proxy_pass $backend;
        
        # ========================================
        # B. 统一转发到天罡 WAF（推荐）
        # ========================================
        # WAF 会根据 Host 头进行检测和转发
        proxy_pass http://tiangang_waf;
        
        # 传递原始请求信息（重要！）
        proxy_set_header Host $http_host;  # 保留原始 Host（包括端口）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-URI $request_uri;
        
        # 不修改 Location 和 Refresh 响应头
        proxy_redirect off;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 32 8k;
        proxy_busy_buffers_size 16k;
        
        # HTTP 版本和连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    
    # 静态资源加速（可选）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://tiangang_waf;
        proxy_set_header Host $http_host;
        
        # 缓存配置
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # 不记录静态资源访问日志
        access_log off;
    }
    
    # 健康检查端点（可选）
    location =/health {
        access_log off;
        return 200 "OK\n";
    }
}

# ============================================
# 7. WebSocket 连接支持
# ============================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ============================================
# 8. 日志格式定义（可选）
# ============================================
log_format waf_log '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   '"$http_x_forwarded_for" "$http_host" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

